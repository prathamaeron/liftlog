<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiftLog</title>
  <meta name="description" content="Personal workout tracker: templates, sets, reps, progress.">
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiftLog">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>LiftLog</a>
      <a href="#/" data-nav="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span>Train</span></a>
      <a href="#/history" data-nav="history"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>History</span></a>
      <a href="#/progress" data-nav="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg><span>Progress</span></a>
      <a href="#/body" data-nav="body"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10a3 3 0 0 1 6 0M12 10l1.5-2"/></svg><span>Body</span></a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <button id="sync-indicator" class="sync-indicator" hidden data-state="idle"><span class="sdot"></span><span class="label">Sync</span></button>
  <noscript>LiftLog needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
